<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080808">
  <title>VISUAL SYNTH</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22><rect width=%2264%22 height=%2264%22 fill=%22%23080808%22/><path d=%22M8 13h48v8H8zm0 15h31v8H8zm17 15h31v8H25z%22 fill=%22%23fff%22/></svg>">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <div>
      <h1>VISUAL SYNTH</h1>
      <p>Looping generative motion studies</p>
    </div>
    <p class="piece-count" id="piece-count" aria-live="polite"></p>
  </header>

  <main>
    <section class="gallery" id="gallery" aria-label="Visual Synth gallery"></section>
    <p class="empty-state" id="empty-state" hidden>No pieces have been selected yet.</p>
  </main>

  <dialog class="viewer" id="viewer" aria-label="Expanded artwork">
    <button class="viewer-close" id="viewer-close" type="button" aria-label="Close viewer">Close</button>
    <button class="viewer-arrow viewer-prev" id="viewer-prev" type="button" aria-label="Previous piece">&#8592;</button>
    <figure>
      <video id="viewer-video" muted loop playsinline controls></video>
      <figcaption id="viewer-caption"></figcaption>
    </figure>
    <button class="viewer-arrow viewer-next" id="viewer-next" type="button" aria-label="Next piece">&#8594;</button>
  </dialog>

  <footer>
    <span>Made with VISUAL SYNTH</span>
    <span>Generative video / 2026</span>
  </footer>

  <script src="gallery-data.js"></script>
  <script src="app.js"></script>
</body>
</html>
